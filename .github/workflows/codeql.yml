name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bandit:
    name: Bandit Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF to GitHub Security

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[sarif]

    - name: Run Bandit
      run: bandit -r . -f sarif -o bandit-results.sarif --exit-zero

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: success() || failure() # Ensures upload runs even if Bandit finds issues and fails
      with:
        sarif_file: bandit-results.sarif
