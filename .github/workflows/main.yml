name: switchyard-python-ci
on: ["push", "pull_request"]

jobs:
  test:
    runs-on: ${{matrix.os}}
    
    strategy:
      # Set to false so one failing version doesn't cancel the remaining jobs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Obtain Code
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .[test]
      - name: Lint Check
        run: ruff check . --output-format=github
      - name: Run tests
        run: pytest
